name: StoreScreenshot

on:
  push:
    branches:
      - main
      - develop

jobs:
  cache-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

  store-screenshot-test:
    needs: cache-gradle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read # for clone
      actions: write # for upload-artifact

    strategy:
      fail-fast: false
      matrix:
        module:
          - feature-user
          - feature-follow

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-


      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # Better than caching and/or extensions of actions/setup-java
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: record screenshot
        id: record-test
        run: |
          ./gradlew :${{ matrix.module }}:recordRoborazziFakeDebug --parallel

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshot-${{ matrix.module }}
          path: |
            **/build/outputs/roborazzi
          retention-days: 30
