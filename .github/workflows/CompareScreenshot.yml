name: CompareScreenshot

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - docs/**
      - README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  save-pr-number:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 2
    steps:
      - name: Save PR number
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p ./pr
          echo ${{ github.event.number }} > ./pr/NR
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr/

  wait-for-storing-screenshot:
    runs-on: ubuntu-latest
    permissions:
      actions: read # for wait-on-check-action
      contents: read # for clone
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Get base branch HEAD commit
        id: get_base_branch_head
        run: echo "sha=$(git rev-parse origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

      - name: Wait for StoreScreenshot workflow to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ steps.get_base_branch_head.outputs.sha }}
          wait-interval: 10
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: wait-for-storing-screenshot
          check-regexp: store-screenshot-test

  compare-screenshot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: wait-for-storing-screenshot

    strategy:
      fail-fast: false
      matrix:
        module:
          - design-system
          - feature-user

    permissions:
      contents: read # for clone
      actions: write # for upload-artifact
      checks: read # for wait-on-check-action

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper

      - name: Get base branch HEAD commit
        id: get_base_branch_head
        run: echo "sha=$(git rev-parse origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - uses: dawidd6/action-download-artifact@v2
        continue-on-error: false
        with:
          name: screenshot-${{ matrix.module }}
          workflow: StoreScreenshot.yml
          commit: ${{ steps.get_base_branch_head.outputs.sha }}
          if_no_artifact_found: fail

      - name: compare screenshot test
        id: compare-screenshot-test
        run: |
          ./gradlew :${{ matrix.module }}:compareRoborazziFakeDebug --parallel

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshot-diff-${{ matrix.module }}
          path: |
            **/build/outputs/roborazzi
          retention-days: 30
